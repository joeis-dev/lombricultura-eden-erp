version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lombrierp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lombrierp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lombri2024secure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lombrierp-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lombrierp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lombri2024secure}
      SERVER_PORT: ${SERVER_PORT:-8080}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lombrierp-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "5174:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
      VITE_PORT: 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
